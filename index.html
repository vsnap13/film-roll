<html lang="th">
<head>

<title>Film Roll</title>
<style>
:root{--bg:#141311;--panel:#1d1b18;--line:#2f2c27;--tx:#ece6da;--dim:#8d867a;--acc:#e3a63b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.app{max-width:480px;margin:0 auto;padding:14px}

input[type=file]{display:none}
.frames{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}
.f{width:20px;height:14px;border-radius:2px;background:var(--line)}.f.on{background:var(--acc)}
.hint{color:var(--dim);font-size:12px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}

.vf{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;background:#0b0b0b;border-radius:14px;padding:10px;box-shadow:0 0 0 1px #2a2a28}

.grid3{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,transparent calc(33.33% - .5px),rgba(255,255,255,.4) calc(33.33% - .5px) calc(33.33% + .5px),transparent calc(33.33% + .5px) calc(66.66% - .5px),rgba(255,255,255,.4) calc(66.66% - .5px) calc(66.66% + .5px),transparent calc(66.66% + .5px)),linear-gradient(to bottom,transparent calc(33.33% - .5px),rgba(255,255,255,.4) calc(33.33% - .5px) calc(33.33% + .5px),transparent calc(33.33% + .5px) calc(66.66% - .5px),rgba(255,255,255,.4) calc(66.66% - .5px) calc(66.66% + .5px),transparent calc(66.66% + .5px))}

.pro{display:flex;flex-direction:column;gap:2px}
.pro .strip{padding:4px 2px;margin:0}
.prow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

.evb{display:flex;align-items:center;gap:8px}
.ev{position:relative;flex:1;height:48px}
.ticks{display:flex;justify-content:space-between;align-items:center;height:100%}

.ev input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0}
.evv{width:64px;text-align:right;color:#cfc9bd;font-size:13px}
.shut{width:84px;height:84px;border-radius:50%;border:0;padding:0;background:linear-gradient(#3b3b39,#161615);box-shadow:0 2px 0 #55554f inset,0 8px 16px #000b;display:grid;place-items:center}

.shut:active i{transform:scale(.92)}
.thumb{width:56px;height:56px;border-radius:8px;border:2px solid #3a3a38;background:#111 center/cover;color:#777;font-size:16px}

.pick{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.82) 28%);padding-top:22px}

.tile[aria-pressed=true] .tg{outline:3px solid #f2c94c;outline-offset:2px}

.tiles.adj{flex-direction:column;gap:8px;overflow:visible}

.tabs{display:flex;justify-content:center;gap:36px;padding:6px 0 0}
.tabs button{background:none;border:0;color:#e8e2d6;font-size:17px;font-weight:600;padding:6px 4px}

.ic{width:24px;height:24px;flex:none}
.hd{display:flex;justify-content:space-between;align-items:center;margin:2px 0 12px}
.rl{font-size:12px;color:var(--dim)}.fr{font-size:22px;font-weight:700}
.cnt{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 12px;color:var(--acc)}
.cnt .ic{width:20px;height:20px}.cnt b{color:var(--tx);font-size:14px}
.hero{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}

.tr{padding:12px 2px 8px;margin:0 -2px}
.sets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.set{position:relative;display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--tx);text-align:left;font-family:inherit;min-height:58px;cursor:pointer}
.set:last-child{grid-column:1/-1}
.si{width:38px;height:38px;border-radius:50%;background:#2a2722;color:var(--acc);display:grid;place-items:center;flex:none}
.st{display:flex;flex-direction:column;min-width:0}.st small{color:var(--dim);font-size:12px}.st b{font-size:15px;font-weight:600}

.set:disabled{opacity:.55}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--acc);color:#1b1407;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer}
.acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 4px;color:var(--tx);font-size:13px;font-family:inherit;cursor:pointer}
.act .ic{width:26px;height:26px;color:var(--acc)}.act:disabled{opacity:.45}
.go:focus-visible,.set:focus-visible,.act:focus-visible{outline:2px solid #fff;outline-offset:2px}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--tx);display:grid;place-items:center;padding:0;flex:none}
.hd select{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:18px;padding:8px 10px;font-size:14px;font-family:inherit}
.hd .fr{font-size:19px;flex:1;margin:0 10px}
.badge2{display:inline-block;background:var(--acc);color:#1b1407;border-radius:10px;padding:0 8px;font-size:13px;vertical-align:middle;margin-left:4px}
.coll{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 8px;margin-top:10px}
.cn{background:none;border:0;padding:0;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:10px;font-family:inherit;cursor:pointer}
.cn em{font-style:normal;font-size:11px;text-align:center;line-height:1.25;color:var(--dim)}
.cn[aria-pressed=true] em{color:var(--acc);font-weight:700}
.cn:disabled{opacity:.5}
.can{width:50px;height:92px;display:flex;flex-direction:column;filter:drop-shadow(0 6px 6px #0008)}
.cn[aria-pressed=true] .can{outline:3px solid var(--acc);outline-offset:4px;border-radius:6px}

.can .bd{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(255,255,255,.22) 30%,rgba(0,0,0,.4)),var(--c);color:#fff;font-style:normal;font-family:Georgia,serif;margin:0 2px}
.can .bd b{font-size:17px;background:rgba(255,255,255,.92);color:#222;padding:1px 4px;border-radius:2px;line-height:1.2}
.can .bd small{font-size:8px;letter-spacing:.04em}
button.hero{width:100%;color:inherit;font-family:inherit;text-align:left;cursor:pointer}
.more{margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--acc);font-size:11px}
.hero:focus-visible,.cn:focus-visible,.back:focus-visible{outline:2px solid #fff;outline-offset:2px}
:root{--bg:#121110;--panel:#1b1a18;--line:#34312c;--tx:#efe9dc;--dim:#9a9285;--acc:#f2b632;--red:#d8372b}
body{background:#121110 radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.3px) 0 0/6px 6px}

    if(ctr){const e=ti.querySelector('[aria-pressed=true]');if(e)ti.scrollLeft=e.offsetLeft-(ti.clientWidth-e.offsetWidth)/2;ctr=false}else ti.scrollLeft=sl;
   }else{
    ti.className='tiles adj';
    ti.innerHTML=[['fx','Effect']].map(([k,l])=>`<div class="arow"><span>${l}</span><div>${OPT[k].map((t,i)=>`<button data-o="${k}:${i}" aria-pressed="${S[k]===i}" ${k==='dev'&&lk()?'disabled':''}>${t}</button>`).join('')}</div></div>`).join('');
   }
  }
  q('#c-t').innerHTML=Array.from({length:13},(_,i)=>`<i class="${i===idx?'on':''}"></i>`).join('');
  q('#c-ev').value=idx;
  q('#c-v').textContent=(S.ev>0?'+':'')+(S.ev===0?'0':S.ev.toFixed(1))+' EV';
  const th=q('#c-th');th.style.backgroundImage=n?`url(${S.shots[n-1]})`:'';th.textContent=n?'':'0';
  q('#c-b').innerHTML=`<b>${k.n}</b><span style="background:${k.c}"></span>`;
 }
 const stop=()=>{run=false;if(st)st.getTracks().forEach(t=>t.stop());o.remove();S.ev=0;render()};
 const crop=()=>{const vw=v.videoWidth,vh=v.videoHeight,z=FOC[zi]/24,sw=vw/z,sh=vh/z;return{sw,sh,sx:(vw-sw)/2,sy:(vh-sh)/2}};
 function shoot(){
  if(!v.videoWidth||rollDone())return;
  const {sw,sh,sx,sy}=crop(),sc=Math.min(1,2400/Math.max(sw,sh));
  const c=document.createElement('canvas');c.width=Math.round(sw*sc);c.height=Math.round(sh*sc);
  const x=c.getContext('2d');x.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height);film(d,STOCKS[S.stock]);x.putImageData(d,0,0);
  S.shots.push(c.toDataURL('image/jpeg',.9));
  if(navigator.vibrate)navigator.vibrate(20);
  fw.style.opacity=.15;setTimeout(()=>fw.style.opacity=1,120);
  if(S.shots.length>=OPT.len[S.len]){S.mode='dev';stop();return}
  ui();render();
 }
 const act={
  dev:()=>{if(lk()){S.mode='dev';stop()}},
  x:stop,
  grid:()=>{grid=!grid;ui()},
  info:()=>{hud=!hud;ui()},
  flip:async()=>{const old=face;face=face==='environment'?'user':'environment';try{await start()}catch(e){face=old;note('Could not switch camera.')}},
  shoot,
  badge:()=>{pk=pk?0:1;ctr=true;ui()},
  ev0:()=>{S.ev=0;ui()},
 };
 o.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.a&&act[b.dataset.a]){act[b.dataset.a]();return}
  if(b.dataset.z!==undefined){zi=+b.dataset.z;ui()}
  else if(b.dataset.s!==undefined&&!lk()){S.stock=+b.dataset.s;ui()}
  else if(b.dataset.t!==undefined){pk=+b.dataset.t;ui()}
  else if(b.dataset.o){const [k,i]=b.dataset.o.split(':');if(!(k==='dev'&&lk())){S[k]=+i}ui()}
 });
 q('#c-ev').addEventListener('input',e=>{S.ev=(+e.target.value-6)/3;ui()});
 stg.addEventListener('click',e=>{if(pk&&!e.target.closest('#c-pk,button')){pk=0;ui()}});
 ui();
 const loop=()=>{
  if(!run)return;
  if(v.videoWidth){
   const {sw,sh,sx,sy}=crop(),sc=(G?960:420)/Math.max(sw,sh),w=Math.round(sw*sc),h=Math.round(sh*sc);
   if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
   let ok=false;
   if(G){try{cx.drawImage(G(v,w,h,sx,sy,sw,sh),0,0);ok=true}catch(e){G=null}}
   if(!ok){cx.drawImage(v,sx,sy,sw,sh,0,0,w,h);const d=cx.getImageData(0,0,w,h);film(d,STOCKS[S.stock]);cx.putImageData(d,0,0)}
   const ar=sw/sh,fwid=Math.min(stg.clientWidth,stg.clientHeight*ar),key=Math.round(fwid)+'x'+Math.round(fwid/ar);
   if(key!==fit){fit=key;fw.style.width=fwid+'px';fw.style.height=(fwid/ar)+'px'}
  }
  requestAnimationFrame(loop);
 };
 loop();
}
async function loadImg(file){
 try{return await createImageBitmap(file)}catch(e){}
 const u=URL.createObjectURL(file),im=new Image();
 await new Promise((ok,no)=>{im.onload=ok;im.onerror=()=>no(new Error('unsupported image'));im.src=u});
 return im;
}
async function shoot(file){
 if(rollDone())return;
 const busy=document.createElement('div');busy.className='busy';busy.textContent='Exposing…';document.body.appendChild(busy);
 try{
  const bm=await loadImg(file),bw=bm.naturalWidth||bm.width,bh=bm.naturalHeight||bm.height;
  const sc=Math.min(1,2400/Math.max(bw,bh));
  const c=document.createElement('canvas');c.width=Math.round(bw*sc);c.height=Math.round(bh*sc);
  const x=c.getContext('2d');x.drawImage(bm,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height);film(d,STOCKS[S.stock]);x.putImageData(d,0,0);
  S.shots.push(c.toDataURL('image/jpeg',.9));
  if(S.shots.length>=OPT.len[S.len])S.mode='dev';
 }catch(e){busy.textContent='Could not process this photo ('+(e.message||e)+'). Tap to close.';busy.onclick=()=>busy.remove();render();return}
 busy.remove();render();
}
function film(img,k){
 const p=img.data,W=img.width,H=img.height;
 const push=S.dev-1,ex=Math.pow(2,push*.35)*Math.pow(2,S.ev||0);
 const con=k.con+.07*push,gr=(k.grain+.07*push)*[.6,1,1.6][S.fx];
 const vg=[.15,.3,.5][S.fx],lt=[[1.04,1,.95],[.97,1,1.05],[1.14,.98,.8]][S.light];
 const lift=(S.paper?22:0)+(k.fade||0),gl=S.paper?.92:1;
 const cx=W/2,cy=H/2,md=Math.hypot(cx,cy);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const i=(y*W+x)*4;
  let r=p[i]*ex*k.tint[0]*lt[0],g=p[i+1]*ex*k.tint[1]*lt[1],b=p[i+2]*ex*k.tint[2]*lt[2];
  const L=.299*r+.587*g+.114*b;
  if(k.bw){r=g=b=L}else{r=L+(r-L)*k.sat;g=L+(g-L)*k.sat;b=L+(b-L)*k.sat}
  r=(r-128)*con+128;g=(g-128)*con+128;b=(b-128)*con+128;
  const dd=Math.hypot(x-cx,y-cy)/md,v=1-vg*dd*dd;
  const n=(Math.random()-.5)*gr*70;
  r=(r*v+n)*gl+lift;g=(g*v+n)*gl+lift;b=(b*v+n)*gl+lift;
  p[i]=r<0?0:r>255?255:r;p[i+1]=g<0?0:g>255?255:g;p[i+2]=b<0?0:b>255?255:b;
 }
}
render();
