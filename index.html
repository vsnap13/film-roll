  fpk.addEventListener('scroll',()=>{
   if(tick)return;tick=true;
   requestAnimationFrame(()=>{tick=false;
    const mid=fpk.scrollLeft+fpk.clientWidth/2;let best=0,bd=1e9;
    cards.forEach((c,i)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid);if(d<bd){bd=d;best=i}});
    if(best!==r.stock){setStock(best);cards.forEach((c,i)=>c.setAttribute('aria-pressed',String(i===best)));ui()}
   });
  });
  s2.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
   if(b.hasAttribute('data-d')){s2.remove();return}
   if(b.dataset.s!==undefined)b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})});
 }
 const act={
  x:stop,
  flip:async()=>{const old=face;face=face==='environment'?'user':'environment';try{await start();cv.style.transform=face==='user'?'scaleX(-1)':''}catch(e){face=old;toast('Could not switch camera.')}},
  flash:async()=>{try{await st.getVideoTracks()[0].applyConstraints({advanced:[{torch:!fl}]});fl=!fl}catch(e){toast('Flash is not available on this camera.')}ui()},
  ev:()=>{ei=(ei+1)%EVS.length;S.ev=EVS[ei];ui()},
  film:pickFilm,shoot,
  dev:()=>{const rr=r;run=false;if(st)st.getTracks().forEach(t=>t.stop());o.remove();document.body.style.overflow='';S.ev=0;S.focal=zi;S.vr=S.cur;S.from='home';go('sheet')}
 };
 o.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.a&&act[b.dataset.a])act[b.dataset.a]();else if(b.dataset.z!==undefined){zi=+b.dataset.z;ui()}});
 ui();
 let fit='';
 const loop=()=>{
  if(!run)return;
  if(v.videoWidth){
   const {sw,sh,sx,sy}=crop(),sc=(G?960:420)/Math.max(sw,sh),w=Math.round(sw*sc),h=Math.round(sh*sc);
   if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
   let ok=false;
   if(G){try{cx.drawImage(G(v,w,h,sx,sy,sw,sh),0,0);ok=true}catch(e){G=null}}
   if(!ok){cx.drawImage(v,sx,sy,sw,sh,0,0,w,h);const d=cx.getImageData(0,0,w,h);film(d,STOCKS[r.stock]);cx.putImageData(d,0,0)}
   const W=vfw.clientWidth-40,H=vfw.clientHeight-20,fw=Math.min(W,H*.75),key=Math.round(fw)+'x'+Math.round(fw/.75);
   if(key!==fit){fit=key;vfr.style.width=fw+'px';vfr.style.height=(fw/.75)+'px'}
  }
  requestAnimationFrame(loop);
 };
 loop();
}
render();
